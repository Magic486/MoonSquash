name: MoonSquash validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install MoonBit and independent test dependencies
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y python3 squashfs-tools liblzma5 liblz4-1 libzstd1 liblzo2-2
      - name: Record environment and test library
        run: |
          moon version --all
          mksquashfs -version
          # Current formatter migrates Int to Int32; retain compatibility with
          # the documented September compiler and report this drift explicitly.
          moon fmt --warn
          moon check --target js
          moon test --target js
          moon test --target wasm-gc
          moon build --target js
          moon run examples/basic --target wasm-gc
      - name: Independent oracle and host regressions
        env:
          # Distro builds may omit deprecated LZMA. The recorded local matrix
          # additionally tests LZMA with squashfs-tools 4.7.5.
          MOONSQUASH_TEST_CODECS: gzip,xz,zstd,lz4,lzo
        run: |
          python3 scripts/linux_oracle.py scripts/moonsquash.cjs
          python3 scripts/full_oracle.py scripts/moonsquash.cjs
          python3 scripts/host_regressions.py scripts/moonsquash.cjs
          python3 scripts/review_spec_cases.py scripts/moonsquash.cjs
          python3 scripts/review_image_cases.py scripts/moonsquash.cjs
          python3 scripts/scale_oracle.py scripts/moonsquash.cjs scripts/host.py
      - name: Published distribution image
        run: |
          curl --fail --location --retry 2 https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-24.10.0-x86-64-generic-squashfs-rootfs.img.gz -o "$RUNNER_TEMP/openwrt-rootfs.img.gz"
          python3 scripts/distribution_oracle.py scripts/moonsquash.cjs "$RUNNER_TEMP/openwrt-rootfs.img.gz"
      - name: Actual archive consumer
        run: |
          moon package
          python3 scripts/package_consumer.py _build/publish/Magic486-moonsquash-0.3.0.zip
